name: Web tests and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-checks:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test web contracts and agent
        run: npm test
      - name: Install locked control dashboard dependencies
        run: npm ci --prefix ecovision/cloud --no-audit --no-fund
      - name: Verify control dashboard and simulated device ACK
        run: |
          node ecovision/cloud/scripts/build-flow.cjs
          git diff --exit-code -- ecovision/cloud/flows.json
          npm test --prefix ecovision/cloud
      - name: Verify production build
        run: npm run build -- --outDir "$RUNNER_TEMP/smart-classroom-web"
      - name: Verify offline sandbox and telemetry contract
        run: |
          node --test ecovision/tests/sandbox/model.test.mjs
          python3 -B -m unittest discover -s ecovision/tests/sandbox -p 'test_*.py' -v
