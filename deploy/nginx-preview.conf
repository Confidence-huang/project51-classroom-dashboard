# 智慧教室网页的 ECS 预览入口。
# 仅监听服务器自身的回环地址；通过 VS Code Remote SSH 转发 18081 端口查看。
# 独立于现有的 80 端口默认站点，保留组长的 /lamp/ 路由。
server {
    listen 127.0.0.1:18081;
    server_name localhost;

    # 本机构建后的 HTML/CSS/JS 放在这里，Nginx 只需要读取权限。
    root /var/www/project51-classroom/site;
    index index.html;

    # 静态资源若不存在就返回 404，避免把首页误当作 JavaScript 加载。
    location /assets/ {
        try_files $uri =404;
    }

    # 刷新网页内部路径时仍返回首页，由浏览器处理页面状态。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
